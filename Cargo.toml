[workspace]
members = ["usc-abi-encoding", "usc-query-builder"]
resolver = "3"

[workspace.package]
license = "Unlicense"
edition = "2024"
rust-version = "1.88"

[workspace.dependencies]
alloy = { version = "0.11", features = [
  "node-bindings",
  "providers",
  "provider-http",
  "provider-ws",
  "rpc-client",
  "rpc-types",
  "rpc-types-eth",
  "consensus",
  "rlp",
  "contract",
  "sol-types",
  "signers",
] }
alloy-json-abi = { version = "0.8.23" }
tokio = { version = "1" }
hex = { version = "0.4" }
# Pinned to avoid issues with alloy
serde = { version = "=1.0.220" }
serde_json = { version = "1.0" }

usc-abi-encoding = { path = "usc-abi-encoding" }
